name: Update Free Iwami stock information

on:
  workflow_dispatch:
  schedule:
    - cron: "*/30 * * * *"

permissions:
  contents: write

jobs:
  update-stock:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.12"

      - name: Install packages
        run: |
          python -m pip install --upgrade pip
          pip install requests beautifulsoup4 feedparser

      - name: Update SNS information
        run: |
          python <<'PY'
          import json
          import re
          import requests
          import feedparser
          from datetime import datetime, timezone

          SOURCES = "sources.json"
          OUTPUT = "data/stock.json"

          KEYWORDS = [
              "完売", "売り切れ", "販売終了", "配布終了",
              "終了しました", "なくなり", "残りわずか",
              "在庫", "販売中", "配布中", "あります",
              "コースター", "ランチョンマット",
              "トレカ", "トレーディングカード",
              "アクリル", "キーホルダー",
              "グッズ", "ノベルティ"
          ]

          def now():
              return datetime.now(timezone.utc).astimezone().strftime(
                  "%Y-%m-%d %H:%M"
              )

          with open(SOURCES, "r", encoding="utf-8") as f:
              config = json.load(f)

          results = []

          session = requests.Session()
          session.headers.update({
              "User-Agent":
                  "Mozilla/5.0 (Windows NT 10.0; Win64; x64) "
                  "AppleWebKit/537.36 Chrome/140 Safari/537.36"
          })

          def add_result(source, text, url):
              if not text:
                  return

              text = re.sub(r"\s+", " ", text).strip()

              if not any(k in text for k in KEYWORDS):
                  return

              lower = text.lower()

              status = "info"

              if any(k in text for k in [
                  "完売", "売り切れ", "販売終了",
                  "配布終了", "終了しました"
              ]):
                  status = "sold_out"

              elif any(k in text for k in [
                  "販売中", "配布中", "あります"
              ]):
                  status = "available"

              results.append({
                  "name": source.get("name", ""),
                  "type": source.get("type", ""),
                  "status": status,
                  "text": text[:500],
                  "url": url,
                  "checked_at": now()
              })

          for source in config.get("sources", []):
              url = source.get("url", "")

              try:
                  r = session.get(url, timeout=20)

                  if r.status_code != 200:
                      continue

                  html = r.text

                  # ページ内のテキストから関連語を探す
                  from bs4 import BeautifulSoup
                  soup = BeautifulSoup(html, "html.parser")

                  for tag in soup(["script", "style", "noscript"]):
                      tag.decompose()

                  text = soup.get_text(" ", strip=True)

                  # 長すぎるページは先頭部分だけでなく
                  # 関連語周辺を優先して取得
                  found = False

                  for keyword in KEYWORDS:
                      pos = text.find(keyword)

                      if pos >= 0:
                          start = max(0, pos - 250)
                          end = min(len(text), pos + 500)
                          add_result(
                              source,
                              text[start:end],
                              url
                          )
                          found = True
                          break

              except Exception as e:
                  print("SKIP:", source.get("name"), str(e))

          data = {
              "updated_at": now(),
              "note": (
                  "公式SNSから取得できた情報のみ掲載。"
                  "取得できないSNSについては在庫を推測しない。"
              ),
              "items": results
          }

          import os
          os.makedirs("data", exist_ok=True)

          with open(OUTPUT, "w", encoding="utf-8") as f:
              json.dump(
                  data,
                  f,
                  ensure_ascii=False,
                  indent=2
              )

          print("Updated:", OUTPUT)
          print("Items:", len(results))
          PY

      - name: Commit updated stock data
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"

          git add data/stock.json

          if git diff --cached --quiet; then
            echo "No changes."
          else
            git commit -m "Update SNS stock information"
            git push
          fi
